
name: Build KCoinRush Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -type f -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KCoinRush-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          

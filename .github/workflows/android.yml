
name: Build KCoinRush Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -print -quit)
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -type f -name settings.gradle.kts -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Firebase
        run: |
          cp google-services.json "$PROJECT_DIR/app/google-services.json"
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["PROJECT_DIR"])

          p = root / "build.gradle.kts"
          s = p.read_text()

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  'id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false',
                  'id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false\n    id("com.google.gms.google-services") version "4.4.2" apply false'
              )

          p.write_text(s)

          p = root / "app/build.gradle.kts"
          s = p.read_text()

          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  'id("org.jetbrains.kotlin.plugin.compose")',
                  'id("org.jetbrains.kotlin.plugin.compose")\n    id("com.google.gms.google-services")'
              )

          if "firebase-bom" not in s:
              s = s.replace(
                  'dependencies {',
                  'dependencies {\n    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))\n    implementation("com.google.firebase:firebase-auth")\n    implementation("com.google.firebase:firebase-firestore")',
                  1
              )

          if "compileOptions" not in s:
              s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """, 1)

          p.write_text(s)
          print("Firebase configured")
          PY

      - name: Add Firebase login file
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/java/com/kcoinrush/app"
          cp FirebaseAuth.kt "$PROJECT_DIR/app/src/main/java/com/kcoinrush/app/FirebaseAuth.kt"

      - name: Replace MainActivity
        run: |
          cp MainActivity.kt "$PROJECT_DIR/app/src/main/java/com/kcoinrush/app/MainActivity.kt"

      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KCoinRush-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          

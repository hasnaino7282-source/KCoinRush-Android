
name: Build KCoinRush Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Find Android project and build APK
        run: |
          SETTINGS_FILE=$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Cannot find settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Android project found in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KCoinRush-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          
